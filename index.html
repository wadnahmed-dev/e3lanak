<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلانك AI - منشئ الإعلانات الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div class="max-w-2xl mx-auto p-4 sm:p-6">
        <header class="text-center my-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">🚀 إعلانك AI</h1>
            <p class="text-sm text-slate-500 mt-1">أنشئ إعلانات تسويقية احترافية بضغطة زر</p>
        </header>

        <main class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">اسم المنتج</label>
                <input type="text" id="productName" value="عسل نحل" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">المميزات</label>
                <textarea id="productFeatures" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800" rows="3">ممتاز طبيعى</textarea>
            </div>

            <button onclick="generateAd()" id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-sm">
                أنشئ إعلاني ✨
            </button>

            <div id="loading" class="hidden text-center my-6">
                <p class="text-blue-600 text-sm animate-pulse">جاري صياغة الإعلان بالذكاء الاصطناعي...</p>
            </div>

            <div id="resultContainer" class="hidden mt-6">
                <label class="block text-sm font-medium text-slate-700 mb-1">النتيجة المقترحة:</label>
                <div id="resultText" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 text-slate-800 whitespace-pre-wrap text-sm leading-relaxed select-all"></div>
            </div>
        </main>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6KZVSsdSY58-6Ykxk2t0U4KSwMSraH8udvJp_LGfEd2XQ";

        async function generateAd() {
            const productName = document.getElementById('productName').value.trim();
            const productFeatures = document.getElementById('productFeatures').value.trim();
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            if (!productName) {
                alert('من فضلك اكتب اسم المنتج!');
                return;
            }

            btn.disabled = true;
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const promptText = `اكتب إعلان تسويقي احترافي وجذاب باللغة العربية لمنتج: "${productName}" ومميزاته: "${productFeatures}". اجعل الإعلان مقسماً إلى: عنوان جذاب، مميزات المنتج، وعرض تسويقي تشجيعي مع إيموجي مناسبة.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const adOutput = data.candidates[0].content.parts[0].text;
                    resultText.textContent = adOutput;
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error(data.error?.message || 'خطأ في جلب البيانات من المفتاح');
                }
            } catch (error) {
                alert('خطأ: ' + error.message);
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
